name: Build SBC AI APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Finds the folder that contains settings.gradle.kts and checks the important files exist.
      # If something is missing, it fails here with a clear message instead of a confusing Gradle error.
      - name: Locate Android project
        shell: bash
        run: |
          echo "=== Files in repo root ==="
          ls -la
          echo "=== Gradle-related files found (up to 4 levels deep) ==="
          find . -maxdepth 4 \( -name 'settings.gradle.kts' -o -name 'build.gradle.kts' -o -name 'libs.versions.toml' -o -name 'gradle.properties' -o -name 'AndroidManifest.xml' \) -not -path './.git/*'

          SETTINGS=$(find . -maxdepth 3 -name 'settings.gradle.kts' -not -path './.git/*' | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts was not found anywhere in the repository. Upload it to the repo root."
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"

          missing=0
          for f in build.gradle.kts gradle.properties gradle/libs.versions.toml app/build.gradle.kts app/src/main/AndroidManifest.xml; do
            if [ ! -f "$DIR/$f" ]; then
              echo "::error::MISSING FILE: $DIR/$f"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 1
          fi
          echo "All required project files are present."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list includes the old 'tools' package, which no longer exists
          # and makes this step fail. We only ask for platform-tools here.
          packages: 'platform-tools'

      - name: Install required SDK packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          # app/build.gradle.kts uses compileSdk 36 (minor 1), so platform 36.1 is needed too
          sdkmanager "platforms;android-36.1" || echo "WARNING: platform 36.1 could not be installed here; Gradle will try to download it"
          sdkmanager --list_installed

      # debug.keystore is in .gitignore, so it is not in the repo.
      # app/build.gradle.kts needs it (signingConfig "debugConfig"), so we create it here.
      - name: Create debug keystore
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -l debug.keystore

      # Optional: add a GEMINI_API_KEY secret in GitHub to use a real key.
      # Without it, a placeholder key is used and the APK still builds.
      - name: Create .env
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > .env
            echo ".env created from GitHub secret"
          else
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
            echo ".env created with placeholder key"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon --no-configuration-cache 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        shell: bash
        run: |
          LOG="${PROJECT_DIR:-.}/build.log"
          if [ -f "$LOG" ]; then
            {
              echo '### Build error summary'
              echo '```'
              grep -n -A25 "What went wrong" "$LOG" | head -80 || true
              grep -n "^e: " "$LOG" | head -30 || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload build log (only on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ env.PROJECT_DIR }}/build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SBC-AI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
