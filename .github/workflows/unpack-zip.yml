name: Unpack project ZIP (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Unzip project into repo root
        shell: bash
        run: |
          shopt -s nullglob
          zips=(./*.zip)
          echo "ZIP files found in repo root: ${#zips[@]}"
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly 1 .zip file in the repo root, found ${#zips[@]}"
            exit 1
          fi
          echo "Unzipping: ${zips[0]}"
          unzip -o "${zips[0]}" -x '__MACOSX/*'
          echo "=== Repo root after unzip ==="
          ls -la
          echo "=== Key files ==="
          ls -l settings.gradle.kts build.gradle.kts gradle.properties gradle/libs.versions.toml app/build.gradle.kts app/src/main/AndroidManifest.xml

      - name: Commit and push project files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Unpack SBC AI project files from ZIP"
            git push
          fi
