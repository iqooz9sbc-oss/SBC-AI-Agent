name: Apply update ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Find update ZIP files
        shell: bash
        run: |
          shopt -s nullglob
          zips=(./SBC-update*.zip)
          echo "Update ZIP files found: ${#zips[@]}"
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No file named SBC-update*.zip found in the repo root. Upload it first."
            exit 1
          fi
          printf '%s\n' "${zips[@]}"

      # Safety copy: a tag pointing at the current working version, made BEFORE anything changes.
      - name: Create backup tag
        shell: bash
        run: |
          TAG="backup-$(date -u +%Y%m%d-%H%M%S)"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Backup tag created: $TAG"

      - name: Apply update ZIP(s)
        shell: bash
        run: |
          shopt -s nullglob
          zips=(./SBC-update*.zip)
          for z in "${zips[@]}"; do
            echo "Applying $z"
            unzip -o "$z"
            rm -f "$z"
          done

      # A debug APK must always be signed with the SAME key, otherwise Android refuses to
      # install a new build over the old one. We create one debug key once and keep it in the repo.
      # (This is only the throw-away DEBUG key with the public password "android", not a release key.)
      - name: Create permanent debug keystore (only if missing)
        shell: bash
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            git add -f debug.keystore
            echo "debug.keystore created"
          else
            echo "debug.keystore already exists"
          fi

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Apply SBC update ZIP"
            git push
          fi
